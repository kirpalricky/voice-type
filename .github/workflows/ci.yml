name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Materialize Secrets.swift from template
        run: |
          [ -f Sources/Yapboard/Secrets.swift ] || cp Sources/Yapboard/Secrets.swift.example Sources/Yapboard/Secrets.swift

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ github.event.repository.name }}-spm-build-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.event.repository.name }}-spm-build-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
